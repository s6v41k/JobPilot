<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobPilot</title>
  <style>
    body { background:#14151a; color:#e8e8ea; font-family:system-ui,sans-serif; max-width:640px; margin:12vh auto; padding:0 1rem; }
    h1 span { color:#f5c518; }
    code { background:#23242b; padding:.15rem .4rem; border-radius:4px; }
    pre { background:#23242b; padding:1rem; border-radius:8px; overflow:auto; }
  </style>
</head>
<body>
  <h1>Job<span>Pilot</span></h1>
  <p>The server is running. The full web interface arrives in the next step.</p>
  <p>Status from <code>/api/health</code>:</p>
  <pre id="status">loading...</pre>
  <script>
    fetch("/api/health").then(r => r.json())
      .then(d => document.getElementById("status").textContent = JSON.stringify(d, null, 2))
      .catch(() => document.getElementById("status").textContent = "The server did not answer.");
  </script>
</body>
</html>
